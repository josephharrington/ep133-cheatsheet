    <rect x="60" y="1" width="55" height="29" fill="#f15a2a"/>
    <rect x="115" y="1" width="147" height="29" fill="#201f20"/>
    <rect x="262" y="1" width="99" height="29" fill="#929b9e"/>
    <line x1="60" y1="1" x2="60" y2="30" stroke="#111111"/>
    <line x1="115" y1="1" x2="115" y2="30" stroke="#111111"/>
    <line x1="262" y1="1" x2="262" y2="30" stroke="#111111"/>
    <line x1="361" y1="1" x2="361" y2="30" stroke="#111111"/>
    <!-- logo plate and speaker -->
