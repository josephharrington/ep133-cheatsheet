      <circle cx="291" cy="40" r="6"/>
      <circle cx="11" cy="137" r="6"/>
      <circle cx="291" cy="137" r="6"/>
    </g>
    <!-- display -->
    <rect x="1" y="148" width="440" height="117" fill="#111111" stroke="#111111" stroke-width="1"/>
    <g transform="translate(150 176)">
      <!-- unlit segment scaffolds -->
      <g fill="#4a5255" opacity=".2">
        <g>
          <use href="#segment-a"/><use href="#segment-b"/><use href="#segment-c"/><use href="#segment-d"/>
          <use href="#segment-e"/><use href="#segment-f"/><use href="#segment-g"/>
          <use href="#segment-h"/><use href="#segment-i"/><use href="#segment-j"/>
          <use href="#segment-k"/><use href="#segment-l"/><use href="#segment-m"/>
        </g>
        <g transform="translate(52)">
          <use href="#segment-a"/><use href="#segment-b"/><use href="#segment-c"/><use href="#segment-d"/>
          <use href="#segment-e"/><use href="#segment-f"/><use href="#segment-g"/>
          <use href="#segment-h"/><use href="#segment-i"/><use href="#segment-j"/>
          <use href="#segment-k"/><use href="#segment-l"/><use href="#segment-m"/>
        </g>
        <g transform="translate(104)">
          <use href="#segment-a"/><use href="#segment-b"/><use href="#segment-c"/><use href="#segment-d"/>
          <use href="#segment-e"/><use href="#segment-f"/><use href="#segment-g"/>
          <use href="#segment-h"/><use href="#segment-i"/><use href="#segment-j"/>
          <use href="#segment-k"/><use href="#segment-l"/><use href="#segment-m"/>
        </g>
      </g>
      <!-- illuminated v2.5 -->
