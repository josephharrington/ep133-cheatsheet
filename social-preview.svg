        <circle cx="97" cy="61" r="4.2"/>
        <g transform="translate(104)">
          <use href="#segment-a"/><use href="#segment-c"/><use href="#segment-d"/><use href="#segment-f"/><use href="#segment-g"/>
        </g>
      </g>
    </g>

    <!-- control surface -->
    <line x1="1" y1="265" x2="441" y2="265" stroke="#111111" stroke-width="1.5"/>
    <g>
      <circle cx="41" cy="311" r="20" fill="#e9e8e3" stroke="#777777"/>
      <circle cx="41" cy="311" r="10" fill="none" stroke="#999999"/>
      <circle cx="341" cy="311" r="20" fill="#f15a2a" stroke="#b83b12"/>
      <circle cx="341" cy="311" r="10" fill="none" stroke="#b83b12"/>
      <circle cx="401" cy="311" r="20" fill="#242223" stroke="#111111"/>
      <circle cx="401" cy="311" r="10" fill="none" stroke="#737373"/>
    </g>
    <g>
      <rect x="335" y="336" width="12" height="11" rx="1" fill="#f15a2a"/>
      <rect x="395" y="336" width="12" height="11" rx="1" fill="#242223"/>
    </g>

    <!-- mode buttons -->
    <g font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
      <rect x="81" y="291" width="42" height="41" fill="#2a2829" stroke="#111111"/>
      <rect x="81" y="312" width="42" height="20" fill="#e8e7e2"/>

      <rect x="141" y="291" width="42" height="41" fill="#2a2829" stroke="#111111"/>
      <rect x="141" y="312" width="42" height="20" fill="#f15a2a"/>

      <rect x="201" y="291" width="42" height="41" fill="#2a2829" stroke="#111111"/>
      <rect x="201" y="312" width="42" height="20" fill="#8a9498"/>

      <rect x="321" y="350" width="39" height="41" fill="#f15a2a" stroke="#111111"/>
      <rect x="321" y="370" width="39" height="21" fill="#e8e7e2"/>

      <rect x="381" y="350" width="39" height="41" fill="#2a2829" stroke="#111111"/>
      <rect x="381" y="370" width="39" height="21" fill="#e8e7e2"/>
    </g>

    <!-- left controls and fader -->
    <g font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
      <rect x="21" y="350" width="40" height="20" fill="#292728" stroke="#111111"/>
      <rect x="21" y="390" width="40" height="20" fill="#292728" stroke="#111111"/>
      <line x1="41" y1="432" x2="41" y2="552" stroke="#292728" stroke-width="6" stroke-linecap="round"/>
      <circle cx="41" cy="482" r="11" fill="#929b9e" stroke="#5d6365"/>
      <rect x="21" y="585" width="40" height="20" fill="#929b9e" stroke="#111111"/>
    </g>

    <!-- pads -->
    <g stroke="#111111" stroke-width="1.5">
      <g fill="#aab2b5">
        <rect x="81" y="350" width="42" height="42" rx="2"/>
        <rect x="81" y="421" width="42" height="42" rx="2"/>
        <rect x="81" y="492" width="42" height="42" rx="2"/>
        <rect x="81" y="563" width="42" height="42" rx="2"/>
      </g>
      <g fill="#252324">
        <rect x="141" y="350" width="42" height="42" rx="2"/>
        <rect x="201" y="350" width="42" height="42" rx="2"/>
        <rect x="261" y="350" width="42" height="42" rx="2"/>
        <rect x="141" y="421" width="42" height="42" rx="2"/>
        <rect x="201" y="421" width="42" height="42" rx="2"/>
        <rect x="261" y="421" width="42" height="42" rx="2"/>
        <rect x="141" y="492" width="42" height="42" rx="2"/>
        <rect x="201" y="492" width="42" height="42" rx="2"/>
        <rect x="261" y="492" width="42" height="42" rx="2"/>
        <rect x="141" y="563" width="42" height="42" rx="2"/>
        <rect x="201" y="563" width="42" height="42" rx="2"/>
        <rect x="261" y="563" width="42" height="42" rx="2"/>
      </g>
      <g fill="#e8e7e2">
        <rect x="321" y="492" width="39" height="42" rx="2"/>
        <rect x="381" y="492" width="39" height="42" rx="2"/>
      </g>
      <rect x="321" y="563" width="39" height="42" rx="2" fill="#f15a2a"/>
      <rect x="381" y="563" width="39" height="42" rx="2" fill="#929b9e"/>
    </g>

    <!-- utility keys -->
    <g font-family="Arial, sans-serif" font-size="7" text-anchor="middle">
      <rect x="321" y="421" width="39" height="42" fill="#292728" stroke="#111111"/>
      <rect x="321" y="441" width="39" height="22" fill="#e8e7e2"/>
      <rect x="381" y="421" width="39" height="42" fill="#292728" stroke="#111111"/>
      <rect x="381" y="441" width="39" height="22" fill="#e8e7e2"/>
    </g>
  </g>
</svg>
