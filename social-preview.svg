    <rect x="301" y="30" width="140" height="118" fill="#9fa3a3" stroke="#111111" stroke-width="1"/>
    <rect x="305" y="34" width="132" height="110" fill="url(#speaker-depth)" mask="url(#speaker-mask)"/>
    <g fill="#ebeae5" stroke="#757575" stroke-width="1">
